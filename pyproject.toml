[project]
name = "video-context"
version = "0.1.0"
description = "Local preprocessing of narrated screen recordings for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
video-context = "video_context.cli:main"

[project.optional-dependencies]
asr = [
    "mlx-whisper @ git+https://github.com/cmoyates/mlx-examples.git@24c78c9c3bcdab8d162ec6b56d73643f2f632a79#subdirectory=whisper",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
# Additive policy from .agents/skills/python-anti-slop/assets/ruff.toml.
extend-select = [
  "ANN001", "ANN002", "ANN003",
  "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "ANN401",
  "B006", "B008", "B009", "B010", "B012", "B018", "B023", "B904",
  "BLE001", "E722",
  "C400", "C401", "C402", "C403", "C404", "C405", "C406",
  "C408", "C409", "C410", "C411", "C413", "C414",
  "RUF017", "RUF100", "PGH003", "PGH004",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty]

# Additive policy from .agents/skills/python-anti-slop/assets/ty.toml.
[tool.ty.rules]
missing-type-argument = "error"
unsound-return-statement = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
blanket-ignore-comment = "error"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_model: opt-in acceptance using an explicitly downloaded local speech model",
  "unit: fast isolated tests",
  "integration: tests that touch filesystem, database, subprocesses, or external services",
  "slow: tests that are useful but too slow for every edit loop",
]
